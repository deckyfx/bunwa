<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>bunwa console</title>
    <!-- One stylesheet. global.css imports tailwindcss itself, so a second
         <link rel="stylesheet" href="tailwindcss"> here emitted the whole
         utility layer twice — two render-blocking requests for one set of
         rules. Resolved by bun-plugin-tailwind either way; no config file. -->
    <link rel="stylesheet" href="./global.css" />

    <!--
      The theme, before the first paint.

      Inline and synchronous on purpose: applying it from React means the page
      renders light, then flips, and the flash is worst in exactly the case
      someone chose dark for — a bright rectangle in a dark room. Small enough
      to be worth the inline script, which is the standard remedy.

      Wrapped in try/catch because localStorage throws outright in some
      privacy modes rather than returning null, and a theme preference must
      never be able to stop the console loading.
    -->
    <script>
      // The system preference is read first, and on its own, because the
      // stylesheet cannot fall back to it: `dark:` is keyed off this class
      // alone, not off a media query. The old catch left no class at all and
      // called that "leaving it to the stylesheet" — so a browser with storage
      // blocked and a dark system preference rendered light.
      var system = false;
      try {
        system = window.matchMedia("(prefers-color-scheme: dark)").matches;
      } catch (e) {
        /* no matchMedia: light is the safe assumption */
      }
      var stored = null;
      try {
        stored = localStorage.getItem("bunwa.theme");
      } catch (e) {
        /* private windows and blocked site data throw; the preference stands */
      }
      if (stored === "dark" || (stored !== "light" && system)) {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>
  <body class="h-full bg-white text-slate-900 dark:bg-slate-950 dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
