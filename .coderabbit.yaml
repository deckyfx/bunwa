# CodeRabbit configuration — https://docs.coderabbit.ai/guides/configure-coderabbit
# Schema: https://coderabbit.ai/integrations/schema.v2.json
language: en-GB

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  # Docs are prose, not code. They are long, they change often while the design
  # is still moving, and a code reviewer has nothing useful to say about them —
  # reviewing them would bury real findings in style notes.
  path_filters:
    - "!docs/**"            # design prose; long-lived, changes constantly, not code
    - "!bun.lock"

  # Findings that have been verified against the code and deliberately not
  # applied. Each is answered by an inline comment at the site and, where the
  # assumption could change, by a test. Re-raising them costs a review slot.
  path_instructions:
    - path: "**/*"
      instructions: >-
        This project uses SQLite, not Redis and not Postgres. ADR-0005 records
        the decision and its trigger. Do not suggest Redis for queues, caching
        or rate limiting, and do not treat the absence of Redis as an
        oversight — the delivery queue is a SQLite table on purpose, because
        one process owns the data and a durable queue that needs no server is
        the smaller system. Postgres-specific advice (row-level security,
        LISTEN/NOTIFY, jsonb operators) is equally out of scope until that
        trigger is met: a second process needing concurrent access.

        Do not report a duplicate or repeated declaration unless you have
        confirmed it in the file's actual current contents. Two consecutive
        reviews reported one as critical and compile-breaking — RELEASED in
        src/db/__tests__/migrations.integration.test.ts, then MessageStoreSeam
        in src/api/__tests__/messages.integration.test.ts. Each is declared
        exactly once; tsc --noEmit exits 0 and the tests pass in both the
        working tree and the committed blob. Both were introduced by a
        whole-block rewrite, which appears to render as overlapping hunks.
        Verify any redeclaration or "this file cannot compile" claim against
        the file itself, not the diff, before reporting it.

    - path: "src/stores/device-store.ts"
      instructions: >-
        The consent state machine is enumerated exhaustively over (this
        project's consent status x whether anyone else holds a standing claim),
        with the table written out in a comment above the branch. Four
        consecutive reviews found a bug here because each fix handled only the
        combination that had been surfaced. If reporting a case, say which row
        of that table is wrong rather than proposing another special case.

    - path: "src/delivery/sender.ts"
      instructions: >-
        Do not report that the DNS rebinding window is open, or ask for the
        connection to be pinned to the validated address. It is a known and
        documented gap, explained in a comment at the site: Bun's fetch has no
        option to bind a connection to a resolved IP while preserving the Host
        header and TLS SNI (1.4 supports only tls, unix, proxy and verbose),
        and Bun.dns exposes only lookup. What is achievable is done — resolve
        immediately before the request, and refuse if any returned address is
        blocked rather than only the first. Closing it needs a hand-rolled HTTP
        client over Bun.connect, which is tracked in docs/08 under stage 2
        hardening rather than attempted in the foundation.

    - path: "src/db/migration-manager.ts"
      instructions: >-
        Do not report a missing mkdir in materialise(). Bun.write creates
        missing parent directories, including the nested meta/ one; this was
        verified against a path whose parents do not exist and is pinned by the
        test "succeeds against a runtime directory that does not exist yet".
        The absence of mkdir is deliberate and documented inline.

    - path: "src/**/*.ts"
      instructions: >-
        This is a Bun + TypeScript project. Prefer Bun native APIs (Bun.file,
        Bun.serve, Bun.spawn) over Node equivalents. Strict TypeScript: flag any
        use of `any` or `unknown` where a precise type is possible. Every
        exported class, function and method needs TSDoc explaining why it
        exists, not just what it does.

    - path: "src/engine/**"
      instructions: >-
        Engine adapters must not leak engine-specific concepts into the control
        plane. Flag any conditional on engine kind outside this directory, and
        any type that mirrors a library's own shape rather than the normalised
        internal one. There is one real engine (Baileys) and one fake; that is
        deliberate — the gowa adapter was deleted in stage 4 rather than kept
        as a failover, because a failover nothing exercises is a claim. Do not
        suggest restoring it or ask why the interface has one implementation:
        ADR-0002 records the reasoning. Unclassified engine failures must
        default to retryable, never fatal.

    - path: "src/stores/**"
      instructions: >-
        Multi-tenant boundary; treat findings here as blocking, not advisory.
        (This rule previously targeted src/tenancy/**, which never existed, so
        it matched nothing while appearing to cover the most sensitive code in
        the project.)
        Every query must be scoped by environment id — a missing predicate is a
        cross-tenant data leak. Flag: any Drizzle query without a where clause
        binding environmentId or projectId; any repository method that takes an
        id without also taking the tenant scope; any use of the raw `db` handle
        outside a store class. Consent is granted per (device, project) and
        inherited by that project's environments — flag anything granting
        access without an active consent row, and anything that reads a consent
        row without checking its status and expiry.

    - path: "src/**/*.ts"
      instructions: >-
        This project's recurring defect is accepting input without validating
        it and then silently substituting a default, so the code runs and
        produces the wrong result. Six review passes on the stage 0 harness
        found that same mistake in five different forms. Flag every instance:
        a parsed value that falls back on NaN or empty string; a config read
        with `??` where the absent case is a mistake rather than an omission;
        an optional parameter whose default silently changes behaviour; a
        catch block that swallows and returns a zero value. Prefer failing
        loudly at the boundary over defaulting.

    - path: "src/auth/**"
      instructions: >-
        API keys are Argon2id-hashed at rest and the plaintext is shown once at
        creation. Flag any code path that logs, stores, returns or compares a
        plaintext key, any non-constant-time comparison, and any key lookup that
        does not check revoked_at and expires_at. The tenant is derived from the
        credential and never accepted from the request — flag any handler that
        reads a project or environment id from the body, query or a header.

    - path: "src/delivery/**"
      instructions: >-
        Outbound webhooks must be queued per virtual device, signed with a
        timestamped HMAC, and retried with backoff. Flag fire-and-forget
        delivery, shared queues across tenants, and any signature scheme that
        omits the timestamp (it permits replay). Webhook URLs are supplied by
        tenants, so flag any outbound request that does not validate the target
        first — scheme allowlist, private and link-local range block,
        resolve-then-pin. gowa's /send/link was measured fetching arbitrary
        caller-supplied URLs server-side (docs/12); bunwa must not add a second
        such hole. Also flag any send whose success is inferred from the engine
        accepting it rather than from a delivery ack: engine acceptance was
        measured to mean nothing for up to 203 seconds after a silent
        disconnect.

    - path: "src/db/__tests__/migrations.integration.test.ts"
      instructions: >-
        The RELEASED table is deliberately a hardcoded list of shipped
        migration hashes and timestamps. Do not suggest deriving it from
        MigrationManager.buildSequence(): pinning the values against the thing
        they exist to pin would make the test vacuous.

    - path: "src/api/routes/events.ts"
      instructions: >-
        Do not report that requireApiKey's `as: "scoped"` leaks onto
        GET /v1/events/stream and rejects requests without x-api-key. It does
        not: the route is registered outside that group, and
        src/api/__tests__/events.integration.test.ts opens it with a ticket and
        no key, receiving 200 and an `event: stream.open` frame. Verified
        against a running server as well. The stream must remain reachable
        without a key — EventSource cannot send headers, which is the entire
        reason ADR-0008 exists.

    - path: "src/stores/stream-ticket-store.ts"
      instructions: >-
        Do not ask for spendTicket to take or bind an environmentId. At
        GET /v1/events/stream there is no authenticated caller — the ticket is
        the credential and the environment is what it resolves to, so a
        caller-supplied environmentId would let the caller assert the tenancy
        the ticket exists to prove. The binding is enforced in mintTicket,
        which runs behind x-api-key and verifies the key belongs to the
        environment. sweepTickets is cross-tenant for the same reason the
        rate-limit sweep is: housekeeping run by the process, with no request
        and no environment to scope to.

    - path: "src/stores/auth-state-store.ts"
      instructions: >-
        Do not ask for an environment or project parameter on these methods.
        Credentials belong to the WhatsApp account, the account belongs to the
        device, and docs/04 makes devices global and system-owned so several
        projects can share one number through consent. A device held by two
        projects has exactly one set of credentials, so there is no environment
        that owns them and the parameter could only be decorative. The tenant
        boundary is enforced where it exists: chat rows carry environment_id,
        ChatStore.record refuses an environment with no active binding, and the
        device routes resolve a binding first. No request reaches this file —
        its only caller is the Baileys port, with a device id the engine
        already holds. The reasoning is in the module header.

    - path: "src/engine/baileys/**"
      instructions: >-
        Only src/engine/baileys/socket.ts may import from
        @whiskeysockets/baileys (ADR-0009). Flag any other file in the
        repository that imports it, and flag any Baileys type appearing in a
        DeviceEngine signature — the moment one does, every other engine has to
        satisfy a Baileys-shaped contract and the adapter boundary is gone. The
        version is pinned exactly, without a caret, on purpose: 7.0.0-rc14 is a
        release candidate chosen deliberately by the owner (ADR-0009), against
        the analysis, with both sides recorded there. Do not suggest widening
        the range, do not suggest downgrading to the 6.x "legacy" line, and do
        not describe the pin as an accident — that trade is recorded and
        settled. The safety argument is no longer "gowa is the failover": there
        is no second engine, and what stands in its place is BAILEYS_ENABLED
        defaulting to off, so a deployment opts in to an engine that has never
        paired a real device. Pay particular attention to disconnect handling:
        401, 403, 440, 500 and 411 must never be retried, and 515 must always
        be, because it is how pairing completes.

    - path: "src/stores/settings-store.ts"
      instructions: >-
        Do not ask for an environment or project parameter on these methods,
        and do not report the absence of one as a cross-tenant leak. The rule
        for src/stores/** is right about every other file in that directory and
        wrong about this one: `settings` holds instance-wide values — the name
        WhatsApp shows this deployment under Linked Devices, and the timezone
        the server renders timestamps in — keyed on `key` alone, one row per
        setting per database. There is exactly one instance per database, so an
        environment id here could only be decorative, the same reasoning as
        src/stores/auth-state-store.ts. The tenant boundary that does matter
        for settings is on the routes that expose them, not in this file.

    - path: "src/console/**"
      instructions: >-
        The React console, served at /app by the same Elysia app that answers
        its calls. It is not a separate project any more and must not become
        one: no second package.json, no second tsconfig, no second copy of
        Elysia or React, and no proxy — that arrangement existed, the two
        copies of Elysia drifted within a day and the proxy pointed at the
        wrong port. Calls go through the Eden Treaty client in
        src/console/lib/api.ts, typed from the server's exported `App`; flag
        any hand-written request type or bare fetch against /v1, because
        hand-written Whoami and VirtualDevice types were both wrong and the
        page rendered "undefined / undefined" against a live API. The API key
        is held in localStorage and is a known weakness recorded in ADR-0008 —
        do not re-report it; the cookie session it names is the fix when there
        is a session to put in one. Flag anything that renders a QR or pairing
        code obtained from anywhere other than the synchronous claim response:
        those are withheld from the event stream on purpose, because a QR is a
        credential and fanning it out would hand it to every other project
        sharing that phone.

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main

chat:
  auto_reply: true
