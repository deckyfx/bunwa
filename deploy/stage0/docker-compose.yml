# Stage 0 harness: a single gowa instance, instrumented, for the measurements
# listed in docs/08-roadmap.md. Not a deployment topology — see docs/03.
name: bunwa-stage0

services:
  gowa:
    image: ghcr.io/aldinokemal/go-whatsapp-web-multidevice:latest
    command: ["rest"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file: [.env]
    extra_hosts:
      # Lets gowa reach the host-side webhook sink on Linux.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/storages:/app/storages
      - ./data/statics:/app/statics
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
