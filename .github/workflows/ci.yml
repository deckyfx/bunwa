name: ci

# Two review passes found eight defects in the measurement harness — code whose
# only job is to check other code. None of them needed a reviewer to catch; a
# typecheck and a handful of assertions would have done. This runs both.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # Default behaviour writes GITHUB_TOKEN into .git/config, where any
          # later step — including code from a pull request — can read it.
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned so a Bun release cannot change CI behaviour without a
          # reviewed commit. Bump deliberately.
          bun-version: "1.4.0"

      - name: Install dependencies
        # One project now. The console moved into src/console, so there is no
        # second manifest to resolve and no workspace to descend into.
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        # bunfig.toml preloads happydom, which has to happen before any test
        # file imports React: React reads `document` at module scope, so a DOM
        # registered later is registered too late.
        run: bun run test

      - name: Verify the schema has a migration generated for it
        # db:embed only reads the journal, so a schema.ts change with no
        # generated migration passes it. Generating here catches that: the
        # binary would otherwise ship a schema it cannot create.
        run: |
          bun run db:generate
          if ! git diff --quiet -- src/db/migrations; then
            echo "::error::src/db/schema.ts has changes with no migration — run 'bun run db:generate'"
            git --no-pager diff --stat -- src/db/migrations
            exit 1
          fi
          echo "schema and migrations agree"

      - name: Verify the embedded migration manifest is current
        # A stale manifest ships a binary that lies about the schema it can
        # create, and the failure is silent — no tables at all.
        run: |
          bun run db:embed
          if ! git diff --quiet -- src/db/migrations-embedded.ts; then
            echo "::error::src/db/migrations-embedded.ts is stale — run 'bun run db:embed'"
            git --no-pager diff -- src/db/migrations-embedded.ts
            exit 1
          fi
          echo "embedded manifest is current"

      - name: Verify no session data is committed
        # The stage-0 harness that this used to guard is gone with gowa, but the
        # risk moved rather than disappeared: bunwa now holds the credentials
        # itself, in the database. A committed .sqlite is a committed WhatsApp
        # account.
        #
        # The pattern covers everything .gitignore protects, which it did not:
        # the ignore rules name *.sqlite, *.sqlite-journal and *.db, and this
        # rejected only .sqlite with -wal and -shm. A committed bunwa.db or a
        # rollback journal — both of which carry the same credentials — passed
        # the guard that exists to stop exactly that.
        #
        # Matches are captured, then tested — no `grep -q` in the condition.
        # `grep -q` exits at the first hit and closes the pipe, so `git ls-files`
        # takes SIGPIPE and the pipeline's status becomes 141 under `pipefail`.
        # The `if` then reads that as false and a tracked database walks past
        # the guard. This step does not set pipefail today, so it fires
        # correctly — but it is one `set -o pipefail`, or one `defaults.run`
        # block with GitHub's documented `-eo pipefail`, away from turning a
        # security check into a no-op that still reports success. Reproduced
        # both ways before changing it.
        run: |
          pattern='\.(sqlite|db)(-(wal|shm|journal))?$'

          # `|| true` would swallow a git failure as well as a clean miss, and
          # an empty result then reads as "nothing tracked" — the guard passing
          # because it never ran. Each command is checked on its own: grep says
          # 0 for a match and 1 for none, and anything above that is grep
          # itself failing, which is not the same answer as "no databases".
          if ! files=$(git ls-files); then
            echo "::error::git ls-files failed; the database check did not run"
            exit 1
          fi

          set +e
          tracked=$(printf '%s\n' "$files" | grep -E "$pattern")
          matched=$?
          set -e
          if [ "$matched" -gt 1 ]; then
            echo "::error::grep failed ($matched); the database check did not run"
            exit 1
          fi

          if [ -n "$tracked" ]; then
            echo "::error::a database is tracked in git"
            printf '%s\n' "$tracked"
            exit 1
          fi
          echo "no database tracked"

  images:
    # Separate job: the checks above are fast and this is not, so a typecheck
    # failure reports in a minute rather than waiting on two image builds.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build both targets
        # Both, because they are not the same image with a flag: `full` has a
        # build stage `api` never runs. Building only one would leave the other
        # broken until someone deployed it.
        run: |
          docker build --target api  -t bunwa:api  .
          docker build --target full -t bunwa:full .

      - name: The engine that stores credentials refuses to start without a key
        # A container that boots without it would write account-takeover
        # material to the database in the clear. Asserted here because it is a
        # deployment property: the unit test proves the config object refuses,
        # this proves the image does.
        run: |
          # The message is asserted, not just the exit status. Treating any
          # non-zero exit as success would pass on an unrelated startup
          # failure — a missing database, a bad image — while the guard never
          # ran, which is a check that can succeed for the wrong reason.
          #
          # timeout, because the failure mode if the guard is gone is a server
          # that starts and serves happily until the job is killed.
          # A marker, because `timeout` forwards the command's own exit
          # status: a container that genuinely exits 124 is otherwise
          # indistinguishable from one the deadline killed. The marker is
          # written inside the timeout and only after the command returns, so
          # its absence means the deadline fired and its contents carry the
          # real status.
          set +e
          output=$(timeout 20s sh -c '
            docker run --rm \
              -e NODE_ENV=production \
              -e BAILEYS_ENABLED=true \
              bunwa:api bun run src/index-headless.ts 2>&1
            printf "__CONTAINER_EXITED_%s__\n" "$?"
          ')
          timed_out=$?
          set -e

          if printf '%s' "$output" | grep -q "__CONTAINER_EXITED_"; then
            status=$(printf '%s' "$output" | sed -n 's/.*__CONTAINER_EXITED_\([0-9]*\)__.*/\1/p' | tail -1)
          else
            # No marker: the command never returned.
            status=124
          fi

          if [ "$status" -eq 0 ]; then
            echo "::error::the image started with baileys enabled and no encryption key"
            printf '%s\n' "$output"
            exit 1
          fi

          # Still running when the deadline fired. Checked before the message,
          # because a server that logs the config error and then serves anyway
          # prints exactly what the grep below looks for — and refusing to
          # start is the whole claim.
          #
          # Fourth revision of this step. It has accepted any non-zero exit,
          # then the message alone, then a timeout that printed the message;
          # each fix was right about the case in front of it.
          if [ "$timed_out" -eq 124 ] && ! printf '%s' "$output" | grep -q "__CONTAINER_EXITED_"; then
            echo "::error::the image did not exit; it was still running when the timeout killed it"
            printf '%s\n' "$output"
            exit 1
          fi

          if ! printf '%s' "$output" | grep -Fq "BAILEYS_ENABLED requires CREDENTIAL_ENCRYPTION_KEY"; then
            echo "::error::the image failed, but not for the reason this step exists to check"
            printf '%s\n' "$output"
            exit 1
          fi

          echo "refused, with the right reason"

      - name: The api image does not mount the console
        # The mechanism behind two tags changed with the console: there is no
        # dashboard/dist to look for any more, because the page is bundled from
        # the HTML import at serve time. What separates the images is which
        # entry point they run, so that is what this asserts — the headless one
        # must not import the console page, or React reaches a build whose whole
        # purpose is to exclude it.
        #
        # Two separate assertions, not one `&&`. Chained, the step passed
        # whenever the page was *missing* — the condition needed both halves
        # true to fail, so the check that the asset exists asserted nothing and
        # a build that shipped no console at all looked correct.
        run: |
          if ! docker run --rm bunwa:api test -e /app/src/console/index.html; then
            echo "::error::the console page is missing from the image entirely"
            exit 1
          fi
          if docker run --rm bunwa:api sh -c 'grep -q "console/index.html" /app/src/index-headless.ts'; then
            echo "::error::the headless entry point imports the console page"
            exit 1
          fi
          echo "bunwa:api does not mount the console"

      - name: Both images serve, and only one serves the console
        # Built images have been wrong in ways the Dockerfile looked right for:
        # a root-owned volume the non-root user could not write, and a CMD
        # comment claiming migrations ran automatically. Running them is the
        # only thing that caught either.
        run: |
          set -euo pipefail
          docker volume create ci-api >/dev/null
          docker volume create ci-full >/dev/null

          # Migrations are deliberate, not a startup side effect, so they run
          # as their own step exactly as an operator would.
          docker run --rm -v ci-api:/data  bunwa:api  bun run src/db/migrate.ts
          docker run --rm -v ci-full:/data bunwa:full bun run src/db/migrate.ts

          docker run -d --name ci-api  -p 127.0.0.1:31901:3000 -v ci-api:/data  bunwa:api
          docker run -d --name ci-full -p 127.0.0.1:31902:3000 -v ci-full:/data bunwa:full

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:31901/health >/dev/null 2>&1 \
               && curl -fsS http://127.0.0.1:31902/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          api_health=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:31901/health)
          api_app=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:31901/app)
          full_health=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:31902/health)
          full_app=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:31902/app)
          echo "api  health=$api_health app=$api_app"
          echo "full health=$full_health app=$full_app"

          test "$api_health"  = "200" || { echo "::error::api did not become healthy"; docker logs ci-api; exit 1; }
          test "$full_health" = "200" || { echo "::error::full did not become healthy"; docker logs ci-full; exit 1; }
          test "$api_app"     = "404" || { echo "::error::bunwa:api served /app"; exit 1; }
          test "$full_app"    = "200" || { echo "::error::bunwa:full did not serve /app"; exit 1; }

          curl -s http://127.0.0.1:31902/app | grep -q "bunwa console" \
            || { echo "::error::bunwa:full served something other than the console"; exit 1; }
          echo "both images behave as their tags claim"

      - name: Stop the containers
        if: always()
        run: docker rm -f ci-api ci-full || true
